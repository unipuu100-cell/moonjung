<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지킬 박사와 하이드 씨 AI 탐험대</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0fdf4;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23dcfce7" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }

        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .message-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-[100dvh] flex flex-col overflow-hidden">

    <div id="login-modal" class="fixed inset-0 bg-indigo-900/80 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl text-center transform transition-transform">
            <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 text-3xl mx-auto mb-4 shadow-inner">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">지킬 앤 하이드 탐험대</h2>
            <p class="text-gray-500 mb-6 text-sm leading-relaxed">입장하기 위해 학번과 이름을 입력해주세요.<br>(선생님은 번호 '0', 이름 '선생님' 입력)</p>
            
            <div class="space-y-3 mb-6">
                <input type="number" id="student-number" placeholder="번호 (예: 1)" class="w-full bg-gray-50 text-gray-800 rounded-xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-indigo-400 border border-gray-200 transition-all">
                <input type="text" id="student-name" placeholder="이름 (예: 홍길동)" class="w-full bg-gray-50 text-gray-800 rounded-xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-indigo-400 border border-gray-200 transition-all" autocomplete="off">
            </div>
            
            <button id="login-btn" onclick="login()" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-md flex justify-center items-center gap-2">
                서버 연결 중... <i class="fa-solid fa-spinner fa-spin"></i>
            </button>
        </div>
    </div>

    <header class="bg-indigo-600 text-white shadow-md p-3 sm:p-4 shrink-0 z-10">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-full text-indigo-600 text-lg sm:text-xl w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight line-clamp-1">지킬 박사와 하이드 씨 AI 탐험대</h1>
                    <p class="text-[10px] sm:text-xs text-indigo-200 hidden sm:block">초등학생을 위한 친절한 고전문학 튜터</p>
                </div>
            </div>
            
            <div id="header-promo" class="hidden sm:block text-sm bg-indigo-500 py-1.5 px-4 rounded-full border border-indigo-400 font-medium">
                <i class="fa-solid fa-robot mr-1"></i> 로그인해주세요!
            </div>
            
            <!-- 로그인 유저 정보 및 상단 메뉴 -->
            <div id="header-user-info" class="hidden flex items-center gap-2 sm:gap-3">
                
                <!-- 상단 차시 선택기 -->
                <select id="top-day-selector" onchange="changeDay(this.value)" class="text-xs sm:text-sm bg-indigo-700 text-white py-1.5 px-2 sm:px-3 rounded-full border border-indigo-500 shadow-inner focus:outline-none focus:ring-2 focus:ring-indigo-400 font-medium cursor-pointer transition-colors hover:bg-indigo-600">
                    <option value="1">1일차 (1, 2장)</option>
                    <option value="2">2일차 (3, 4장)</option>
                    <option value="3">3일차 (5, 6장)</option>
                    <option value="4">4일차 (7, 8장)</option>
                    <option value="5">5일차 (9, 10장)</option>
                    <option value="6">6일차 (11장)</option>
                </select>

                <!-- 3단계 학습 모드 토글 -->
                <div id="student-mode-toggle" class="hidden sm:flex bg-indigo-700/50 p-1 rounded-full gap-1">
                    <button id="mode-word-btn" onclick="setMode('word')" class="text-xs sm:text-sm bg-white text-indigo-700 py-1 px-3 rounded-full font-bold shadow-sm transition-colors">단어 모드</button>
                    <button id="mode-chat-btn" onclick="setMode('chat')" class="text-xs sm:text-sm text-indigo-100 hover:bg-indigo-600 py-1 px-3 rounded-full font-bold transition-colors">질문 모드</button>
                    <button id="mode-quiz-btn" onclick="setMode('quiz')" class="text-xs sm:text-sm text-indigo-100 hover:bg-indigo-600 py-1 px-3 rounded-full font-bold transition-colors">퀴즈 모드</button>
                </div>
                
                <!-- 유저 뱃지 -->
                <div class="text-xs sm:text-sm font-medium bg-indigo-700 py-1.5 px-3 sm:px-4 rounded-full border border-indigo-500 shadow-inner hidden sm:block">
                    <i class="fa-solid fa-user-graduate mr-1"></i> <span id="header-user-name"></span>
                </div>
                
                <button onclick="logout()" class="text-xs sm:text-sm bg-white text-indigo-600 hover:bg-indigo-50 py-1.5 px-3 rounded-full font-bold transition-colors shadow-sm">
                    로그아웃
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-2 sm:p-4 flex flex-col lg:flex-row gap-3 sm:gap-6 min-h-0 overflow-hidden">
        
        <!-- Left Panel: Info & Suggested Questions -->
        <aside id="left-aside" class="w-full lg:w-1/3 flex flex-col gap-3 sm:gap-4 overflow-y-auto shrink-0 max-h-[35vh] lg:max-h-none border-b border-gray-200 lg:border-none pb-2 lg:pb-0 pr-1 lg:pr-2" style="display: none;">
            <div id="suggested-panel" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-5 shrink-0 flex-1">
                <h2 class="text-md sm:text-lg font-bold text-gray-800 mb-3 border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-chalkboard-user text-indigo-500"></i> 선생님 찬스
                </h2>
                <div class="mb-5 flex flex-col gap-2 border-b border-gray-100 pb-5">
                    <button onclick="fillAndSend('선생님, 제가 읽은 부분까지 줄거리를 한 번에 정리해주세요!')" class="text-left bg-orange-50 hover:bg-orange-100 transition-colors py-2.5 px-3 rounded-xl text-xs sm:text-sm text-orange-800 font-medium border border-orange-200 shadow-sm flex gap-2 items-center">
                        <span class="text-lg">📝</span> <span>이번 차시 <strong>줄거리 요약</strong> 보기</span>
                    </button>
                </div>

                <h2 class="text-md sm:text-lg font-bold text-gray-800 mb-2 flex items-center gap-2">
                    <i class="fa-regular fa-lightbulb text-yellow-500"></i> 이렇게 질문해 보세요!
                </h2>
                
                <!-- 동적 추천 질문 영역 (사용자가 텍스트를 입력해야 활성화) -->
                <div id="placeholder-suggested" class="text-sm text-gray-400 py-8 text-center bg-gray-50 rounded-xl border border-dashed border-gray-200 mb-2">
                    오른쪽 채팅창에<br>궁금한 내용을<br>먼저 입력해 볼까요? 🧐
                </div>
                
                <div id="suggested-questions-container" class="flex flex-col gap-2 hidden">
                    <!-- 기본 추천 질문 -->
                    <button onclick="fillAndSend('지킬 박사는 어떤 사람인가요?')" class="text-left bg-indigo-50 hover:bg-indigo-100 transition-colors py-2.5 px-3 rounded-xl text-xs sm:text-sm text-indigo-800 font-medium shadow-sm">
                        🙋‍♂ "지킬 박사는 어떤 사람인가요?"
                    </button>
                    <button onclick="fillAndSend('유언장이라는 단어의 뜻이 궁금해요.')" class="text-left bg-blue-50 hover:bg-blue-100 transition-colors py-2.5 px-3 rounded-xl text-xs sm:text-sm text-blue-800 font-medium shadow-sm">
                        📖 "유언장이라는 단어의 뜻이 궁금해요."
                    </button>
                    <button onclick="fillAndSend('이 책의 주제나 교훈은 무엇일까요?')" class="text-left bg-green-50 hover:bg-green-100 transition-colors py-2.5 px-3 rounded-xl text-xs sm:text-sm text-green-800 font-medium shadow-sm">
                        ✨ "이 책의 주제나 교훈은 무엇일까요?"
                    </button>
                </div>
            </div>
        </aside>

        <!-- Right Panel: Chat Interface -->
        <section class="w-full bg-white rounded-2xl shadow-lg border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden relative">
            
            <!-- Chat Header -->
            <div class="bg-white border-b border-gray-100 p-3 flex items-center justify-between shrink-0 z-10 shadow-sm">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500 text-lg border border-indigo-100">
                        <i class="fa-solid fa-chalkboard-user"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 id="chat-header-title" class="font-bold text-gray-800 text-sm sm:text-base truncate">AI 선생님</h3>
                        <div id="chat-header-subtitle" class="flex items-center gap-1 text-[10px] sm:text-xs text-green-500 font-medium">
                            <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 bg-green-500 rounded-full inline-block"></span> 온라인
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 pl-2">
                    <div id="teacher-tabs-wrapper" class="hidden flex-col items-end gap-1">
                        <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200" id="teacher-mode-toggle">
                            <button id="teacher-view-chat" onclick="setTeacherViewMode('chat')" class="px-3 py-1 text-xs font-bold rounded-md bg-indigo-100 text-indigo-700 transition-colors shadow-sm">대화 분석</button>
                            <button id="teacher-view-quiz" onclick="setTeacherViewMode('quiz')" class="px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-50 transition-colors">퀴즈 결과</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 선생님 모드 차시 탭 -->
            <div id="teacher-tabs-container" class="hidden bg-gray-50 border-b border-gray-200 p-2 overflow-x-auto whitespace-nowrap gap-2 shrink-0 custom-scrollbar">
            </div>

            <!-- 학생 목표 트래커 (질문 모드 전용) -->
            <div id="student-goal-tracker" class="hidden bg-gray-50 border-b border-gray-200 p-2 text-xs flex justify-center gap-3 items-center shrink-0 shadow-inner">
                <span class="font-bold text-gray-600"><i class="fa-solid fa-flag text-indigo-500"></i> 오늘의 질문 목표 :</span>
                <span id="goal-content" class="px-2 py-1 bg-red-100 text-red-700 rounded-md font-bold border border-red-200 shadow-sm transition-colors">내용 0 / 2개</span>
                <span id="goal-thought" class="px-2 py-1 bg-blue-100 text-blue-700 rounded-md font-bold border border-blue-200 shadow-sm transition-colors">생각 0 / 1개</span>
            </div>

            <!-- 메인 컨텐츠 영역 -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50/30 custom-scrollbar"></div>
            <div id="quiz-container" class="hidden flex-1 overflow-y-auto p-4 bg-gray-50/30 custom-scrollbar"></div>

            <!-- 채팅 입력창 (단어/질문 모드) -->
            <div id="chat-input-container" class="p-3 sm:p-4 bg-white border-t border-gray-100 shrink-0 shadow-inner">
                <form id="chat-form" class="flex gap-2 relative">
                    <input type="text" id="user-input" class="flex-1 bg-gray-100 text-gray-800 text-sm rounded-full py-3 sm:py-3.5 pl-5 pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all border border-transparent focus:bg-white focus:shadow-sm" placeholder="단어 뜻이나 궁금한 점을 입력해보세요!" autocomplete="off">
                    <button type="submit" id="send-btn" class="absolute right-1.5 top-1.5 bottom-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center transition-transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-paper-plane text-sm ml-0.5"></i>
                    </button>
                </form>
                <div class="text-center mt-2 flex justify-between px-2">
                    <span class="text-[10px] text-gray-400">AI가 답변을 생성합니다. 부정확한 정보가 포함될 수 있습니다.</span>
                    <span id="legend-colors" class="text-[10px] font-bold hidden"><span class="text-teal-500 mr-1">단어(초록)</span> / <span class="text-red-500 mr-1">내용(빨강)</span> / <span class="text-blue-500">생각(파랑)</span></span>
                </div>
            </div>

            <!-- 하단 네비게이션 바 (모드 간 이동) -->
            <div id="bottom-nav-bar" class="hidden bg-white border-t border-gray-100 p-3 flex justify-between shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
                <button id="nav-prev-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 px-4 rounded-xl font-bold transition-colors shadow-sm text-sm flex items-center">
                    이전
                </button>
                <button id="nav-next-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 px-4 rounded-xl font-bold transition-colors shadow-sm text-sm flex items-center ml-auto">
                    다음
                </button>
            </div>
            
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jekyll-hyde-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth, currentUser;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase 초기화 에러:", error);
        }

        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');
        const sendBtn = document.getElementById('send-btn');
        const loginBtn = document.getElementById('login-btn');

        // 상태 관리
        let currentStudentId = null;
        let currentStudentName = null;
        let currentDay = '1';
        let currentMode = 'word'; // word(단어), chat(질문), quiz(퀴즈)
        
        // --- 모드별로 완전히 분리된 기록 데이터 ---
        let wordChatHistory = []; 
        let wordUiHistory = [];   
        let questionChatHistory = [];
        let questionUiHistory = [];
        
        let studentDataCache = {}; 
        let isTeacherMode = false;

        // 선생님 모드 상태
        let teacherCurrentDay = 'ALL';
        let teacherCurrentStudent = 'ALL';
        let teacherViewMode = 'chat'; 
        let allStudentsData = [];
        let allQuizzesData = [];

        const dayRanges = {
            '1': '1장 의문의 실험실, 2장 거리에서 벌어진 일',
            '2': '3장 유언장, 4장 숨은 자와 쫓는 자',
            '3': '5장 지킬을 만나다, 6장 참혹한 사건',
            '4': '7장 꼬리를 무는 의문, 8장 래니언에게 닥친 공포',
            '5': '9장 지킬의 고백, 10장 최후',
            '6': '11장 마지막 편지'
        };

        const apiKey = ""; 
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        async function initAuth() {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    const credential = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = credential.user;
                } else {
                    const credential = await signInAnonymously(auth);
                    currentUser = credential.user;
                }
                loginBtn.disabled = false;
                loginBtn.innerHTML = `탐험 시작하기! <i class="fa-solid fa-rocket ml-1"></i>`;
            } catch (error) {
                console.error("Auth 연결 에러:", error);
                loginBtn.innerText = "서버 연결 실패 😢";
            }
        }
        initAuth();

        function formatText(text) {
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formattedText = formattedText.replace(/\n/g, '<br>');
            return formattedText;
        }

        // 입력 시 추천 질문 활성화 로직
        userInput.addEventListener('input', () => {
            if (userInput.value.trim().length > 0) {
                document.getElementById('placeholder-suggested').classList.add('hidden');
                document.getElementById('suggested-questions-container').classList.remove('hidden');
            }
        });

        function renderActiveModeChat() {
            chatMessages.innerHTML = '';
            const activeUi = currentMode === 'word' ? wordUiHistory : questionUiHistory;
            activeUi.forEach(item => {
                if (item.image) appendImage(item.image, false, currentMode);
                else appendMessage(item.role, item.text, false, item.classification, item.isSuggested, item.id, currentMode);
            });
            scrollToBottom();
        }

        window.setMode = (mode) => {
            if (isTeacherMode) return;
            currentMode = mode;
            
            // 상단 토글 UI 업데이트
            ['word', 'chat', 'quiz'].forEach(m => {
                const btn = document.getElementById(`mode-${m}-btn`);
                if(btn) {
                    btn.className = m === mode 
                        ? 'text-xs sm:text-sm bg-white text-indigo-700 py-1 px-3 rounded-full font-bold shadow-sm transition-colors' 
                        : 'text-xs sm:text-sm text-indigo-100 hover:bg-indigo-600 py-1 px-3 rounded-full font-bold transition-colors';
                }
            });

            const chatMessagesDiv = document.getElementById('chat-messages');
            const chatInput = document.getElementById('chat-input-container');
            const quizContainer = document.getElementById('quiz-container');
            const leftAside = document.getElementById('left-aside');
            const goalTracker = document.getElementById('student-goal-tracker');
            const bottomNav = document.getElementById('bottom-nav-bar');
            const legendColors = document.getElementById('legend-colors');
            
            bottomNav.classList.remove('hidden');
            const prevBtn = document.getElementById('nav-prev-btn');
            const nextBtn = document.getElementById('nav-next-btn');

            if (mode === 'word') {
                // 단어 모드
                chatMessagesDiv.classList.remove('hidden');
                chatInput.classList.remove('hidden');
                quizContainer.classList.add('hidden');
                leftAside.style.display = 'none'; 
                goalTracker.style.display = 'none';
                legendColors.classList.add('hidden');
                
                prevBtn.style.visibility = 'hidden';
                nextBtn.style.visibility = 'visible';
                nextBtn.innerHTML = '질문 모드로 가기 <i class="fa-solid fa-arrow-right ml-1"></i>';
                nextBtn.onclick = () => setMode('chat');
                
                document.querySelector('section').classList.remove('lg:w-2/3');
                document.querySelector('section').classList.add('lg:w-full');
                
                renderActiveModeChat();

            } else if (mode === 'chat') {
                // 질문 모드
                chatMessagesDiv.classList.remove('hidden');
                chatInput.classList.remove('hidden');
                quizContainer.classList.add('hidden');
                leftAside.style.display = 'flex'; 
                goalTracker.style.display = 'flex';
                legendColors.classList.remove('hidden');
                
                prevBtn.style.visibility = 'visible';
                prevBtn.innerHTML = '<i class="fa-solid fa-arrow-left mr-1"></i> 단어 모드로 가기';
                prevBtn.onclick = () => setMode('word');
                
                nextBtn.style.visibility = 'visible';
                nextBtn.innerHTML = '퀴즈 모드로 가기 <i class="fa-solid fa-arrow-right ml-1"></i>';
                nextBtn.onclick = () => setMode('quiz');
                
                document.querySelector('section').classList.add('lg:w-2/3');
                document.querySelector('section').classList.remove('lg:w-full');
                
                renderActiveModeChat();

            } else if (mode === 'quiz') {
                // 퀴즈 모드
                chatMessagesDiv.classList.add('hidden');
                chatInput.classList.add('hidden');
                quizContainer.classList.remove('hidden');
                leftAside.style.display = 'none';
                goalTracker.style.display = 'none';
                
                prevBtn.style.visibility = 'visible';
                prevBtn.innerHTML = '<i class="fa-solid fa-arrow-left mr-1"></i> 질문 모드로 가기';
                prevBtn.onclick = () => setMode('chat');
                
                nextBtn.style.visibility = 'hidden';
                
                document.querySelector('section').classList.remove('lg:w-2/3');
                document.querySelector('section').classList.add('lg:w-full');
                
                loadAndRenderQuiz();
            }
        };

        // 학생이 차시를 바꿀 때 실행
        window.changeDay = (day) => {
            if (isTeacherMode) return;
            currentDay = day;
            loadSessionForDay(day);
            if (currentMode === 'quiz') loadAndRenderQuiz();
        };

        function loadSessionForDay(day) {
            wordChatHistory = []; wordUiHistory = [];
            questionChatHistory = []; questionUiHistory = [];
            chatMessages.innerHTML = '';
            
            let sessionFound = false;
            
            if (studentDataCache.sessions && studentDataCache.sessions[day]) {
                const sess = studentDataCache.sessions[day];
                wordChatHistory = sess.wordChatHistory || [];
                wordUiHistory = sess.wordUiHistory || [];
                // 이전 레거시 데이터 호환
                questionChatHistory = sess.questionChatHistory || sess.chatHistory || []; 
                questionUiHistory = sess.questionUiHistory || sess.uiHistory || [];
                sessionFound = true;
            } else if (studentDataCache.activeSession && studentDataCache.activeSession.day === day) {
                // 더 오래된 레거시 데이터 호환
                questionChatHistory = studentDataCache.activeSession.chatHistory || [];
                questionUiHistory = studentDataCache.activeSession.uiHistory || [];
                sessionFound = true;
            }

            if (sessionFound && (wordUiHistory.length > 0 || questionUiHistory.length > 0)) {
                renderActiveModeChat();
                updateSuggestedQuestions();
                updateGoalTracker();
            } else {
                startFreshSession();
            }
        }

        function startFreshSession() {
            const wordWelcome = `안녕! 나는 너희들의 독서를 도와줄 AI 선생님이야. 🎩📚\n\n현재 [${currentDay}일차]를 학습 중이구나.\n이곳은 **단어 모드**란다. 책을 읽다가 모르는 단어가 있으면 언제든 물어봐!`;
            const chatWelcome = `이곳은 **질문 모드**란다! 🎩📚\n\n이야기 내용이나 네 생각, 궁금한 점들을 자유롭게 질문해 보자. 선생님이 쉽고 재미있게 알려줄게!`;

            wordChatHistory = [{ role: "user", parts: [{ text: "단어 모드 시작" }] }, { role: "model", parts: [{ text: wordWelcome }] }];
            wordUiHistory = [{ role: "model", text: wordWelcome }];
            
            questionChatHistory = [{ role: "user", parts: [{ text: "질문 모드 시작" }] }, { role: "model", parts: [{ text: chatWelcome }] }];
            questionUiHistory = [{ role: "model", text: chatWelcome }];
            
            renderActiveModeChat();
            saveChatSession(); 
            updateGoalTracker();
        }

        async function saveChatSession() {
            if (!currentUser || !currentStudentId) return;
            try {
                if(!studentDataCache.sessions) studentDataCache.sessions = {};
                studentDataCache.sessions[currentDay] = { 
                    wordChatHistory, wordUiHistory, 
                    questionChatHistory, questionUiHistory 
                };

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_chats', currentStudentId);
                await setDoc(docRef, { 
                    sessions: { 
                        [currentDay]: { wordChatHistory, wordUiHistory, questionChatHistory, questionUiHistory } 
                    },
                    lastUpdated: new Date().toISOString() 
                }, { merge: true });
            } catch (e) {}
        }

        async function loadAndRenderQuiz() {
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '<div class="text-center py-16 text-indigo-500"><i class="fa-solid fa-spinner fa-spin text-4xl mb-4"></i><p class="font-medium">선생님이 객관식 퀴즈를 준비하고 있어요...</p></div>';

            try {
                const docId = `${currentStudentId}_${currentDay}`;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_quizzes', docId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().submitted) {
                    renderQuizResults(docSnap.data());
                } else if (docSnap.exists() && docSnap.data().quizData) {
                    renderQuizForm(docSnap.data().quizData);
                } else {
                    const generatedQuiz = await generateQuizFromLLM();
                    await setDoc(docRef, { studentId: currentStudentId, day: currentDay, quizData: generatedQuiz, submitted: false }, { merge: true });
                    renderQuizForm(generatedQuiz);
                }
            } catch (e) {
                console.error(e);
                quizContainer.innerHTML = '<div class="text-center py-10 text-red-500 font-bold">퀴즈를 불러오는 데 실패했어요. 다시 시도해주세요.</div>';
            }
        }

        async function generateQuizFromLLM() {
            const range = dayRanges[currentDay] || '전체';
            const prompt = `학생은 지금 '지킬 박사와 하이드 씨'의 [${currentDay}일차: ${range}] 부분을 읽었습니다.
이 범위의 핵심 내용을 바탕으로 초등학생이 풀기 좋은 **객관식(4지선다) 3문제**를 만들어주세요.

반드시 아래 JSON 형식으로만 응답하세요. (주관식은 절대 출제 금지)
{
  "multipleChoice": [
    {
      "question": "문제 내용",
      "options": ["보기1", "보기2", "보기3", "보기4"],
      "answer": 0 
    }
  ]
}`;
            const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } };
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            let jsonText = result.candidates[0].content.parts[0].text;
            jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(jsonText);
        }

        function renderQuizForm(quizData) {
            const container = document.getElementById('quiz-container');
            let html = `<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-8 max-w-2xl mx-auto">
                <h2 class="text-xl sm:text-2xl font-bold text-indigo-800 mb-6 flex items-center gap-2"><i class="fa-solid fa-pen-to-square"></i> ${currentDay}일차 퀴즈 미션</h2>
                <form id="quiz-form" onsubmit="submitQuiz(event, ${JSON.stringify(quizData).replace(/"/g, '&quot;')})">`;
            
            html += `<h3 class="font-bold text-base sm:text-lg text-gray-800 mb-3 border-b border-gray-100 pb-2">✏️ 내용 확인 문제 (객관식)</h3>`;
            quizData.multipleChoice.forEach((q, i) => {
                html += `<div class="mb-6"><p class="font-medium text-gray-800 mb-3">${i+1}. ${q.question}</p><div class="space-y-2">`;
                q.options.forEach((opt, j) => {
                    html += `<label class="flex items-center gap-3 p-3 sm:p-4 rounded-xl border border-gray-200 hover:bg-indigo-50 hover:border-indigo-200 cursor-pointer transition-colors"><input type="radio" name="mcq-${i}" value="${j}" required class="w-4 h-4 text-indigo-600"> <span class="text-sm sm:text-base">${opt}</span></label>`;
                });
                html += `</div></div>`;
            });

            html += `<button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 sm:py-4 rounded-xl transition-colors shadow-md mt-6 text-sm sm:text-base">선생님께 제출하기</button>
                </form></div>`;
            container.innerHTML = html;
        }

        window.submitQuiz = async (e, quizData) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            let score = 0;
            const mcqAnswers = [];
            quizData.multipleChoice.forEach((q, i) => {
                const ans = parseInt(formData.get(`mcq-${i}`));
                mcqAnswers.push(ans);
                if (ans === q.answer) score += 1;
            });

            const submitData = {
                quizData, 
                answers: { mcq: mcqAnswers },
                score: score, 
                total: quizData.multipleChoice.length, 
                submitted: true, 
                timestamp: new Date().toISOString()
            };

            const docId = `${currentStudentId}_${currentDay}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_quizzes', docId);
            await setDoc(docRef, submitData, { merge: true });
            
            renderQuizResults(submitData);
            document.getElementById('quiz-container').scrollTop = 0;
        };

        // 오늘의 질문 목표(내용 2, 생각 1)를 달성했는지 체크하는 함수
        function checkGoalsMet() {
            let cCount = 0; let tCount = 0;
            questionUiHistory.forEach(item => {
                if (item.role === 'user' && !item.isSuggested && item.classification !== '단어') {
                    if (item.classification === '내용') cCount++;
                    if (item.classification === '생각') tCount++;
                }
            });
            return (cCount >= 2 && tCount >= 1);
        }

        // 퀴즈를 많이 틀렸을 때 새로운 퀴즈를 다시 생성하는 함수
        window.retryQuiz = async () => {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '<div class="text-center py-16 text-indigo-500"><i class="fa-solid fa-spinner fa-spin text-4xl mb-4"></i><p class="font-medium">새로운 퀴즈를 만들고 있어요...</p></div>';
            
            try {
                const generatedQuiz = await generateQuizFromLLM();
                const docId = `${currentStudentId}_${currentDay}`;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_quizzes', docId);
                // 제출 상태를 초기화하고 새로운 퀴즈 데이터를 덮어씌움
                await setDoc(docRef, { studentId: currentStudentId, day: currentDay, quizData: generatedQuiz, submitted: false }, { merge: true });
                renderQuizForm(generatedQuiz);
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="text-center py-10 text-red-500 font-bold">퀴즈를 불러오는 데 실패했어요. 다시 시도해주세요.</div>';
            }
        };

        function renderQuizResults(data) {
            const container = document.getElementById('quiz-container');
            const goalsMet = checkGoalsMet();
            const failedQuiz = data.score <= (data.total - 2); // 3문제 중 2문제 이상 틀린 경우 (1점 이하)
            
            let html = '';

            if (failedQuiz) {
                // 퀴즈 2개 이상 오답 시 재도전 안내
                html += `
                <div class="bg-gradient-to-r from-red-100 to-orange-100 rounded-3xl p-6 sm:p-8 border border-red-200 mb-8 text-center shadow-md max-w-2xl mx-auto transform transition-all duration-500 hover:scale-[1.02]">
                    <div class="text-4xl sm:text-5xl mb-3 animate-bounce">💪</div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-red-800 mb-2">앗, 퀴즈를 2개 이상 틀렸어요!</h2>
                    <p class="text-red-700 font-medium sm:text-lg mb-5">틀린 문제를 다시 한번 확인해 보고,<br>새로운 문제로 다시 도전해 보세요!</p>
                    <button onclick="retryQuiz()" class="bg-red-600 hover:bg-red-700 text-white text-lg font-bold py-4 px-8 rounded-2xl shadow-lg transition-transform hover:scale-105 animate-pulse">
                        새로운 퀴즈 다시 풀기 <i class="fa-solid fa-rotate-right ml-1"></i>
                    </button>
                </div>`;
            } else if (!goalsMet) {
                // 퀴즈는 통과했으나 질문 목표 미달 시
                html += `
                <div class="bg-gradient-to-r from-yellow-100 to-orange-100 rounded-3xl p-6 sm:p-8 border border-yellow-200 mb-8 text-center shadow-md max-w-2xl mx-auto transform transition-all duration-500 hover:scale-[1.02]">
                    <div class="text-4xl sm:text-5xl mb-3 animate-bounce">🤔</div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-orange-800 mb-2">아직 모든 미션이 끝나지 않았어요!</h2>
                    <p class="text-orange-700 font-medium sm:text-lg mb-5">퀴즈는 통과했지만, 오늘의 <strong>질문 목표(내용 2개, 생각 1개)</strong>를 채우지 못했어요.<br>선생님께 질문을 더 해볼까요?</p>
                    <button onclick="setMode('chat')" class="bg-orange-500 hover:bg-orange-600 text-white text-xl font-extrabold py-5 px-10 rounded-2xl shadow-lg transition-transform hover:scale-105">
                        질문 모드로 돌아가기 <i class="fa-solid fa-arrow-left ml-1"></i>
                    </button>
                </div>`;
            } else {
                // 퀴즈 통과 + 목표 모두 달성 시
                html += `
                <div class="bg-gradient-to-r from-pink-100 to-purple-100 rounded-3xl p-6 sm:p-8 border border-pink-200 mb-8 text-center shadow-md max-w-2xl mx-auto transform transition-all duration-500 hover:scale-[1.02]">
                    <div class="text-4xl sm:text-5xl mb-3 animate-bounce">🎉</div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-purple-800 mb-2">오늘 할 일 완벽하게 끝!</h2>
                    <p class="text-purple-600 font-medium sm:text-lg">단어 학습, 질문하기, 마지막 퀴즈까지 모두 훌륭하게 해냈어요!<br>정말 자랑스러워요!</p>
                </div>`;
            }

            // 하단 퀴즈 상세 결과 (공통)
            html += `<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-8 max-w-2xl mx-auto">
                <div class="text-center mb-8 border-b border-gray-100 pb-6">
                    <h2 class="text-2xl font-bold text-gray-800">퀴즈 결과 확인</h2>
                    <div class="mt-4 inline-block bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100">객관식 정답 수: <strong class="text-indigo-600">${data.score} / ${data.total}</strong></div>
                </div>`;
            
            data.quizData.multipleChoice.forEach((q, i) => {
                const userAns = data.answers.mcq[i]; const isCorrect = userAns === q.answer;
                html += `<div class="mb-5 p-4 rounded-xl ${isCorrect ? 'bg-green-50 border border-green-100' : 'bg-red-50 border border-red-100'}">
                    <p class="font-medium text-gray-800 mb-2"><span class="${isCorrect ? 'text-green-600' : 'text-red-500'} font-bold">${isCorrect ? 'O' : 'X'}</span> ${i+1}. ${q.question}</p>
                    <p class="text-sm text-gray-600"><span class="font-bold mr-1">나의 답:</span> ${q.options[userAns]}</p>
                    ${!isCorrect ? `<p class="text-sm text-green-700 mt-1"><span class="font-bold mr-1">정답:</span> ${q.options[q.answer]}</p>` : ''}
                </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function appendMessage(role, text, save = true, classification = '기타', isSuggested = false, msgId = null, targetMode = currentMode) {
            if (!msgId) msgId = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 5);
            
            // 현재 보고 있는 모드와 메시지가 속한 모드가 다르면 화면에 그리지 않음
            if (targetMode !== currentMode) {
                if (save) {
                    const item = { role, text, classification, isSuggested, id: msgId };
                    if (targetMode === 'word') wordUiHistory.push(item);
                    else questionUiHistory.push(item);
                    saveChatSession();
                }
                return msgId;
            }

            const messageDiv = document.createElement('div');
            messageDiv.id = msgId; messageDiv.className = 'flex items-start gap-2 sm:gap-3 message-enter mb-4';
            
            if (role === 'user') {
                messageDiv.classList.add('flex-row-reverse');
                let bgClass = 'bg-white text-gray-800 border-gray-200 border';
                let labelHtml = '<div class="text-[10px] mb-1 font-bold text-gray-400">일반 대화</div>';

                if (isSuggested) { bgClass = 'bg-gray-100 text-gray-600 border-gray-300 border'; labelHtml = '<div class="text-[10px] mb-1 font-bold text-gray-500"><i class="fa-solid fa-wand-magic-sparkles"></i> 선생님 찬스 (평가 제외)</div>'; } 
                else if (classification === '분류중') { bgClass = 'bg-gray-50 text-gray-500 border-gray-200 border'; labelHtml = '<div class="text-[10px] mb-1 font-bold text-indigo-400"><i class="fa-solid fa-spinner fa-spin"></i> 질문 분석 중...</div>'; } 
                else if (classification === '단어') { bgClass = 'bg-teal-500 text-white border-teal-600 border'; labelHtml = '<div class="text-[10px] mb-1 font-bold text-teal-100"><i class="fa-solid fa-spell-check"></i> 단어 학습 모드</div>'; }
                else {
                    if (classification === '내용') { bgClass = 'bg-red-500 text-white border-red-600 border'; labelHtml = '<div class="text-[10px] mb-1 font-bold text-red-100"><i class="fa-solid fa-book-open"></i> 내용 질문</div>'; } 
                    else if (classification === '생각') { bgClass = 'bg-blue-500 text-white border-blue-600 border'; labelHtml = '<div class="text-[10px] mb-1 font-bold text-blue-100"><i class="fa-solid fa-lightbulb"></i> 생각 질문</div>'; }
                }

                messageDiv.innerHTML = `<div class="w-7 h-7 sm:w-8 sm:h-8 bg-indigo-500 rounded-full flex items-center justify-center text-white flex-shrink-0 mt-1 shadow-sm"><i class="fa-solid fa-user text-xs sm:text-sm"></i></div><div id="${msgId}-bubble" class="${bgClass} p-3 sm:p-3.5 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm leading-relaxed transition-colors duration-500"><div id="${msgId}-label">${labelHtml}</div><div>${text}</div></div>`;
            } else {
                messageDiv.innerHTML = `<div class="w-7 h-7 sm:w-8 sm:h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 flex-shrink-0 mt-1 border border-indigo-200 shadow-sm"><i class="fa-solid fa-robot text-xs sm:text-sm"></i></div><div class="bg-white border border-gray-200 text-gray-800 p-3 sm:p-3.5 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] text-sm leading-relaxed">${formatText(text)}</div>`;
            }
            chatMessages.appendChild(messageDiv); scrollToBottom();
            
            if (save) { 
                const item = { role, text, classification, isSuggested, id: msgId };
                if (targetMode === 'word') wordUiHistory.push(item);
                else questionUiHistory.push(item);
                saveChatSession(); 
                
                if (role === 'user' && classification !== '분류중' && targetMode === 'chat') updateGoalTracker(); 
            }
            return msgId;
        }

        function applyClassificationToUI(msgId, classification) {
            const bubble = document.getElementById(msgId + '-bubble'); const label = document.getElementById(msgId + '-label');
            if (!bubble || !label) return;
            bubble.className = "p-3 sm:p-3.5 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm leading-relaxed transition-colors duration-500";
            if (classification === '단어') { bubble.classList.add('bg-teal-500', 'text-white', 'border-teal-600', 'border'); label.innerHTML = '<div class="text-[10px] mb-1 font-bold text-teal-100"><i class="fa-solid fa-spell-check"></i> 단어 학습 모드</div>'; }
            else if (classification === '내용') { bubble.classList.add('bg-red-500', 'text-white', 'border-red-600', 'border'); label.innerHTML = '<div class="text-[10px] mb-1 font-bold text-red-100"><i class="fa-solid fa-book-open"></i> 내용 질문</div>'; } 
            else if (classification === '생각') { bubble.classList.add('bg-blue-500', 'text-white', 'border-blue-600', 'border'); label.innerHTML = '<div class="text-[10px] mb-1 font-bold text-blue-100"><i class="fa-solid fa-lightbulb"></i> 생각 질문</div>'; } 
            else { bubble.classList.add('bg-white', 'text-gray-800', 'border-gray-200', 'border'); label.innerHTML = '<div class="text-[10px] mb-1 font-bold text-gray-400">일반 대화</div>'; }
        }

        function appendImage(base64Data, save = true, targetMode = currentMode) {
            if (targetMode === currentMode) {
                const messageDiv = document.createElement('div'); messageDiv.className = 'flex items-start gap-2 sm:gap-3 message-enter mb-4';
                messageDiv.innerHTML = `<div class="w-7 h-7 sm:w-8 sm:h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 flex-shrink-0 mt-1 border border-indigo-200 shadow-sm"><i class="fa-solid fa-robot text-xs sm:text-sm"></i></div><div class="bg-white border border-gray-200 p-2 sm:p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] flex flex-col gap-2"><img src="${base64Data}" alt="AI 생성 이미지" class="rounded-xl max-w-full h-auto shadow-sm border border-gray-100"></div>`;
                chatMessages.appendChild(messageDiv); scrollToBottom();
            }
            if (save) { 
                const item = { role: 'model', image: base64Data };
                if (targetMode === 'word') wordUiHistory.push(item);
                else questionUiHistory.push(item);
                saveChatSession(); 
            }
        }

        async function updateSuggestedQuestions() {
            if (currentMode === 'word') return; 
            if (questionChatHistory.length < 3) return; 

            const prompt = `지금까지의 대화를 바탕으로, 초등학생이 선생님에게 이어서 할 법한 좋은 질문 2가지를 만들어주세요. 반드시 JSON 배열 형식 ["질문1", "질문2"] 로만 답하세요.`;
            const payload = { contents: [...questionChatHistory, { role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } };
            const container = document.getElementById('suggested-questions-container');
            
            fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(result => {
                    let jsonText = result.candidates[0].content.parts[0].text;
                    jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const questions = JSON.parse(jsonText);
                    if (Array.isArray(questions) && questions.length > 0) {
                        container.innerHTML = questions.slice(0, 2).map((q, i) => `
                            <button onclick="fillAndSend('${q}')" class="text-left bg-${i===0?'indigo':'blue'}-50 hover:bg-${i===0?'indigo':'blue'}-100 transition-colors py-2.5 px-3 rounded-xl text-xs sm:text-sm text-${i===0?'indigo':'blue'}-800 font-medium shadow-sm">
                                ${i===0?'🙋‍♂️':'📖'} "${q}"
                            </button>
                        `).join('');
                    }
                }).catch(e => console.log(e));
        }

        async function classifyQuestion(text) {
            const prompt = `질문: "${text}"
위 질문을 다음 중 하나로만 분류하세요: "내용", "생각", "기타".
- 내용: 줄거리, 사건, 등장인물 행동 묻기
- 생각: 감상, 만약 나라면, 왜 그랬을까, 의미 묻기
- 기타: 관련 없는 이야기
어떤 부연 설명도 없이 딱 한 단어로 대답하세요.`;

            const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "text/plain" } };
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                const cls = result.candidates[0].content.parts[0].text.trim().replace(/['"]/g, '');
                if (cls.includes('내용')) return '내용';
                if (cls.includes('생각')) return '생각';
                return '기타';
            } catch (e) { return '기타'; }
        }

        async function classifyQuestionAndUpdate(text, msgId) {
            const classification = await classifyQuestion(text);
            const historyItem = questionUiHistory.find(item => item.id === msgId);
            if (historyItem) historyItem.classification = classification;
            
            applyClassificationToUI(msgId, classification);
            saveChatSession();
            updateGoalTracker();
        }

        function updateGoalTracker() {
            let cCount = 0; let tCount = 0;
            questionUiHistory.forEach(item => {
                if (item.role === 'user' && !item.isSuggested && item.classification !== '단어') {
                    if (item.classification === '내용') cCount++;
                    if (item.classification === '생각') tCount++;
                }
            });
            
            const elContent = document.getElementById('goal-content');
            const elThought = document.getElementById('goal-thought');
            if (!elContent || !elThought) return;

            elContent.innerText = `내용 ${cCount} / 2개`;
            elContent.className = cCount >= 2 ? 'px-2 py-1 bg-green-100 text-green-700 rounded-md font-bold border border-green-200 shadow-sm transition-colors' : 'px-2 py-1 bg-red-100 text-red-700 rounded-md font-bold border border-red-200 shadow-sm transition-colors';

            elThought.innerText = `생각 ${tCount} / 1개`;
            elThought.className = tCount >= 1 ? 'px-2 py-1 bg-green-100 text-green-700 rounded-md font-bold border border-green-200 shadow-sm transition-colors' : 'px-2 py-1 bg-blue-100 text-blue-700 rounded-md font-bold border border-blue-200 shadow-sm transition-colors';
        }

        async function processChatTurn(userText) {
            const activeChatHistory = currentMode === 'word' ? wordChatHistory : questionChatHistory;
            
            if (userText) activeChatHistory.push({ role: "user", parts: [{ text: userText }] });

            let dynamicSystemPrompt = `당신은 초등학생들을 위한 친절하고 다정한 AI 교사입니다. 학생은 현재 [${currentDay}일차: ${dayRanges[currentDay]}] 부분까지만 읽었습니다. 스포일러 절대 금지. 영어 단어 노출 절대 금지. 객관식 문제나 선택지 제공 금지. 한국어 존댓말로만 짧게(1~2문단) 답하세요. 그림 그리기를 유도하는 영어나 태그를 노출하지 마세요.`;

            if (currentMode === 'word') {
                dynamicSystemPrompt += `\n\n[현재 모드: 단어 모드]\n오직 단어의 뜻만 쉽게 예시를 들어 설명하세요. 내용이나 생각을 물어보면 "이곳은 단어 모드란다! 아래 '다음' 버튼을 눌러 질문 모드에서 물어봐 줘!"라고 거절하세요.`;
            } else {
                dynamicSystemPrompt += `\n\n[현재 모드: 질문 모드]\n책 내용 질문이나 감상에 스스로 생각하도록 힌트를 주며 답변하세요. 학생이 "19세기 런던의 시대적 배경에 대해 설명해주세요"라고 물어보면 5학년 수준으로 쉽고 짧게 설명하고 마지막에 "선생님이 19세기 런던의 으스스한 거리를 그림으로도 보여줄까?"라고 다정하게 물어보세요.`;
            }

            const payload = { contents: activeChatHistory, systemInstruction: { parts: [{ text: dynamicSystemPrompt }] } };

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                const candidate = result.candidates?.[0];
                
                if (!candidate) throw new Error();

                const textPart = candidate.content.parts.find(p => p.text);
                activeChatHistory.push(candidate.content); 
                removeTypingIndicator(); 
                if (textPart) appendMessage('model', textPart.text);
                
                if(currentMode === 'chat') updateSuggestedQuestions();
            } catch (error) { removeTypingIndicator(); appendMessage('model', "네트워크 오류가 발생했어요. 다시 시도해 주세요."); }
        }

                            const wUi = session.wordUiHistory || [];

                    };
                    if (studentDataObj.sessions) {
                        Object.keys(studentDataObj.sessions).forEach(dayKey => renderIfMatch(studentDataObj.sessions[dayKey], dayKey));

        function renderTeacherQuizView() {
            chatMessages.innerHTML = '';
            renderTeacherStudentList(); 

            const filteredQuizzes = allQuizzesData.filter(q => {
                const matchStudent = teacherCurrentStudent === 'ALL' || q.studentId === teacherCurrentStudent;
                const matchDay = teacherCurrentDay === 'ALL' || q.day === teacherCurrentDay;
                return matchStudent && matchDay && q.submitted;
            });

            if (filteredQuizzes.length === 0) { chatMessages.innerHTML += '<div class="text-center text-gray-500 py-10 mt-5">제출된 퀴즈 결과가 없습니다.</div>'; return; }

            const quizResultWrap = document.createElement('div');
            quizResultWrap.className = 'mt-5';

            if (teacherCurrentStudent === 'ALL') {
                let html = `<div class="mb-5 border-b border-indigo-100 pb-3"><h4 class="font-bold text-lg text-indigo-800"><i class="fa-solid fa-chart-bar"></i> 객관식 전체 통계</h4></div>`;
                const qStats = {};
                filteredQuizzes.forEach(quiz => {
                    if(quiz.quizData.multipleChoice) quiz.quizData.multipleChoice.forEach((q, i) => {
                        if (!qStats[q.question]) qStats[q.question] = { options: q.options, answer: q.answer, counts: new Array(q.options.length).fill(0), total: 0 };
                        const uAns = quiz.answers.mcq[i]; if (uAns !== undefined && uAns >= 0) { qStats[q.question].counts[uAns]++; qStats[q.question].total++; }
                    });
                });

                Object.keys(qStats).forEach((qText, idx) => {
                    const stat = qStats[qText];
                    html += `<div class="bg-white border border-gray-200 rounded-xl p-5 mb-5 shadow-sm"><p class="font-bold mb-4">Q${idx+1}. ${qText}</p><div class="space-y-3">`;
                    stat.options.forEach((opt, optIdx) => {
                        const count = stat.counts[optIdx]; const percent = stat.total > 0 ? Math.round((count / stat.total) * 100) : 0; const isCorrect = optIdx === stat.answer;
                        html += `<div class="relative"><div class="flex justify-between text-sm mb-1 z-10 relative px-2"><span class="${isCorrect ? 'font-bold text-green-700' : 'text-gray-700'}">${opt} ${isCorrect?'(정답)':''}</span><span class="font-bold">${count}명 (${percent}%)</span></div><div class="w-full bg-gray-100 rounded-full h-7 absolute top-0 left-0"><div class="${isCorrect ? 'bg-green-200' : 'bg-indigo-100'} h-7 rounded-full" style="width: ${percent}%"></div></div></div>`;
                    });
                    html += `</div></div>`;
                });
                quizResultWrap.innerHTML = html;
            } else {
                let html = '';
                filteredQuizzes.forEach(quiz => {
                    html += `<div class="bg-white border border-indigo-100 rounded-2xl p-5 mb-5 shadow-sm"><div class="flex justify-between items-center border-b pb-3 mb-4"><h4 class="font-bold text-indigo-800">${quiz.studentId} <span class="text-xs ml-1 bg-gray-100 px-2 rounded-md">${quiz.day}일차</span></h4><span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">객관식: ${quiz.score}/${quiz.total}</span></div>`;
                    if(quiz.quizData.multipleChoice) {
                        quiz.quizData.multipleChoice.forEach((q, i) => {
                            const uAns = quiz.answers.mcq[i]; const isCorrect = uAns === q.answer;
                            html += `<div class="bg-gray-50 p-4 rounded-xl border ${isCorrect?'border-green-200':'border-red-200'} mb-3"><p class="font-medium mb-3"><span class="${isCorrect?'text-green-600':'text-red-500'} font-bold">${isCorrect?'O':'X'}</span> ${q.question}</p><div class="space-y-1.5">`;
                            q.options.forEach((opt, oIdx) => {
                                const isSel = oIdx === uAns; const isAns = oIdx === q.answer;
                                let cls = "text-gray-500"; let icon = `<i class="fa-regular fa-circle w-4"></i>`;
                                if (isSel && isCorrect) { cls = "text-green-700 font-bold bg-green-100/50 rounded"; icon = `<i class="fa-solid fa-circle-check text-green-600 w-4"></i>`; }
                                else if (isSel && !isCorrect) { cls = "text-red-600 font-bold bg-red-50 rounded"; icon = `<i class="fa-solid fa-circle-xmark text-red-500 w-4"></i>`; }
                                else if (!isSel && isAns) { cls = "text-green-600 font-bold bg-green-50/50 rounded"; icon = `<i class="fa-solid fa-check text-green-500 w-4"></i>`; }
                                html += `<div class="text-sm px-2 py-1 ${cls} flex items-center gap-2">${icon} ${opt}</div>`;
                            });
                            html += `</div></div>`;
                        });
                    }
                    html += `</div>`;
                });
                quizResultWrap.innerHTML = html;
            }
            chatMessages.appendChild(quizResultWrap);
        }

        function renderSessionBlock(title, sessionHistory) {
            const separator = document.createElement('div'); separator.className = 'my-8 border-b-2 border-indigo-200 text-center relative';
            separator.innerHTML = `<span class="bg-indigo-50 px-4 text-xs font-bold text-indigo-600 relative -top-3 rounded-full border border-indigo-100">${title}</span>`;

                else if (item.role === 'user') {
                    const isRed = item.classification === '내용'; const isBlue = item.classification === '생각'; const isTeal = item.classification === '단어';
                    let cls = 'bg-white border-gray-200 text-gray-800'; let lbl = '일반 대화';
                    if(isTeal) { cls = 'bg-teal-500 text-white border-teal-600'; lbl = '단어 질문'; } else if(isRed) { cls = 'bg-red-500 text-white border-red-600'; lbl = '내용 질문'; } else if (isBlue) { cls = 'bg-blue-500 text-white border-blue-600'; lbl = '생각 질문'; }
                    chatMessages.innerHTML += `<div class="flex items-start gap-2 sm:gap-3 mb-4 flex-row-reverse"><div class="w-7 h-7 bg-indigo-500 rounded-full flex items-center justify-center text-white mt-1"><i class="fa-solid fa-user"></i></div><div class="${cls} border p-3 rounded-2xl rounded-tr-none text-sm"><div class="text-[10px] mb-1 font-bold opacity-70">${lbl}</div>${item.text}</div></div>`;
                } else { chatMessages.innerHTML += `<div class="flex items-start gap-2 sm:gap-3 mb-4"><div class="w-7 h-7 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 mt-1"><i class="fa-solid fa-robot"></i></div><div class="bg-white border border-gray-200 text-gray-800 p-3 rounded-2xl rounded-tl-none text-sm">${formatText(item.text)}</div></div>`; }
            });
        }

        window.logout = () => {
            isTeacherMode = false;
            document.getElementById('left-aside').classList.remove('hidden'); document.getElementById('left-aside').style.display = ''; 
            document.getElementById('chat-input-container').style.display = '';  
            document.getElementById('bottom-nav-bar').style.display = 'none';
            document.getElementById('chat-header-title').innerText = 'AI 선생님'; 
            document.getElementById('teacher-tabs-wrapper').classList.add('hidden'); document.getElementById('teacher-tabs-wrapper').classList.remove('flex'); 
            document.getElementById('teacher-tabs-container').classList.add('hidden'); document.getElementById('teacher-tabs-container').classList.remove('flex'); 
            document.getElementById('student-mode-toggle').classList.add('hidden'); document.getElementById('student-mode-toggle').classList.remove('flex'); 
            document.getElementById('student-goal-tracker').style.display = 'none';
            document.getElementById('top-day-selector').classList.add('hidden');

            currentStudentId = null; 
            wordChatHistory = []; wordUiHistory = [];
            questionChatHistory = []; questionUiHistory = [];
            studentDataCache = {};
            
            chatMessages.innerHTML = ''; document.getElementById('quiz-container').innerHTML = ''; 
            document.getElementById('login-modal').classList.remove('hidden'); document.getElementById('header-user-info').classList.add('hidden'); 
            document.getElementById('header-promo').classList.remove('hidden'); 
            document.getElementById('student-number').value = ''; document.getElementById('student-name').value = '';
        };

        window.fillAndSend = (text) => { userInput.value = text; chatForm.dispatchEvent(new Event('submit', { cancelable: true })); };

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault(); if (isTeacherMode) return;
            const text = userInput.value.trim(); if (!text || !currentStudentId) return;
            userInput.disabled = true; sendBtn.disabled = true;
            
            const wasSuggested = text.startsWith("선생님, 제가 읽은") || text.includes("어떤 사람인가요") || text.includes("유언장이라는 단어") || text.includes("주제나 교훈") || text.includes("19세기 런던");
            
            // 단어 모드면 강제로 '단어' 분류
            const initialClass = (currentMode === 'word') ? '단어' : (wasSuggested ? '기타' : '분류중');
            const msgId = appendMessage('user', text, true, initialClass, wasSuggested, null, currentMode);
            userInput.value = '';
            
            if (!wasSuggested && currentMode === 'chat') { classifyQuestionAndUpdate(text, msgId); }
            
            showTypingIndicator(); await processChatTurn(text);
            
            userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
        });
        
        document.getElementById('student-name').addEventListener('keypress', (e) => { if (e.key === 'Enter' && !loginBtn.disabled) window.login(); });
    </script>
</body>
</html>
